<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forjA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body class="bg-black text-light">
    <div class="container py-5">
        <header class="mb-4 text-center">
            <h1 class="h3 fw-bold">forjA</h1>
            <p class="text-secondary">Digite o site e clique nas tags para gerar.</p>
        </header>
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <div class="mb-3">
                    <label for="targetInput" class="form-label text-info fw-semibold">Alvo (ex: site.com):</label>
                    <input type="text" id="targetInput" class="form-control form-control-lg font-monospace bg-dark text-light border-secondary" placeholder="site.com">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Clique nas tags para exibir:</label>
                    <div id="tagsContainer" class="d-flex flex-wrap gap-2">
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-8" id="dorksContainer">
                <div class="text-center text-secondary py-4 border border-secondary rounded bg-dark">Nenhuma tag selecionada. Clique em uma tag acima.</div>
            </div>
        </div>
    </div>
    <script src="dorks.js"></script>
    <script>
        let selectedTags = new Set();
        if (typeof allDorks !== 'undefined') {
            renderTags();
        } else {
            document.getElementById('tagsContainer').innerHTML = '<span class="text-danger small">Erro: O arquivo dorks.js não foi encontrado na mesma pasta.</span>';
        }
        function renderTags() {
            const container = document.getElementById('tagsContainer');
            const allTags = [...new Set(allDorks.flatMap(item => item.tags || []))];

            let html = '';
            allTags.forEach(tag => {
                const isSelected = selectedTags.has(tag);
                const btnClass = isSelected ? 'btn-primary' : 'btn-outline-secondary';
                html += `<button type="button" class="btn btn-sm ${btnClass}" onclick="toggleTag('${tag}')">${tag}</button>`;
            });

            container.innerHTML = DOMPurify.sanitize(html, { ALLOWED_TAGS: ['button'], ALLOWED_ATTR: ['type', 'class', 'onclick'] });
        }
        function toggleTag(tag) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
            } else {
                selectedTags.add(tag);
            }
            renderTags();
            renderDorks();
        }
        function renderDorks() {
            const container = document.getElementById('dorksContainer');
            container.innerHTML = '';
            const rawTarget = document.getElementById('targetInput').value.trim();
            const safeTarget = DOMPurify.sanitize(rawTarget);

            if (selectedTags.size === 0) {
                container.innerHTML = '<div class="text-center text-secondary py-4 border border-secondary rounded bg-dark">Nenhuma tag selecionada. Clique em uma tag acima.</div>';
                return;
            }
            const dorksToDisplay = allDorks.filter(item => 
                item.tags && item.tags.some(t => selectedTags.has(t))
            );
            if (dorksToDisplay.length === 0) {
                container.innerHTML = '<div class="text-center text-secondary py-4 border border-secondary rounded bg-dark">Nenhuma dork encontrada para as tags selecionadas.</div>';
                return;
            }
            dorksToDisplay.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card mb-3 bg-dark border-secondary shadow-sm';
                
                let finalDorkQuery = item.dork;
                if (safeTarget) {
                    finalDorkQuery = `site:${safeTarget} ${item.dork}`;
                }

                const safeName = DOMPurify.sanitize(item.name);
                const safeDesc = DOMPurify.sanitize(item.description);
                const safeDorkVal = DOMPurify.sanitize(finalDorkQuery);
                card.innerHTML = `
                    <div class="card-body">
                        <h5 class="card-title text-info mb-2">${safeName}</h5>
                        
                        <!-- Input da dork com o botão de abrir na frente -->
                        <div class="input-group mb-3">
                            <input type="text" class="form-control font-monospace text-light bg-black border-secondary" value="${safeDorkVal}" readonly>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(finalDorkQuery)}" target="_blank" rel="noopener noreferrer" class="btn btn-light">Abrir</a>
                        </div>

                        <!-- Descrição da dork em baixo -->
                        <p class="card-text text-secondary small mb-0">${safeDesc}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        document.getElementById('targetInput').addEventListener('input', renderDorks);
    </script>
</body>
</html>
